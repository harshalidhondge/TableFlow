<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Bella Vista</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:
linear-gradient(
rgba(0,0,0,.55),
rgba(0,0,0,.55)
),
url("{{ url_for('static', filename='images/restaurant-bg.jpg') }}");

background-size:cover;

background-position:center;

}

.login-card{

width:430px;

background:rgba(255,255,255,.92);

backdrop-filter:blur(18px);

border-radius:25px;

padding:40px;

box-shadow:0 20px 45px rgba(0,0,0,.35);

animation:fadeIn .8s;

}

@keyframes fadeIn{

from{

opacity:0;

transform:translateY(30px);

}

to{

opacity:1;

transform:translateY(0);

}

}

.logo{

font-size:42px;

text-align:center;

margin-bottom:10px;

}

h2{

text-align:center;

color:#1B4332;

font-weight:700;

}

.tagline{

text-align:center;

color:#777;

margin-bottom:30px;

}

.form-control{

border-radius:12px;

padding:12px;

}

.form-control:focus{

border-color:#D4AF37;

box-shadow:0 0 10px rgba(212,175,55,.35);

}

.btn-login{

width:100%;

background:#1B4332;

color:white;

padding:12px;

border:none;

border-radius:12px;

font-weight:600;

transition:.3s;

}

.btn-login:hover{

background:#D4AF37;

color:#1B4332;

}

.register-link{

text-align:center;

margin-top:20px;

}

.register-link a{

text-decoration:none;

color:#1B4332;

font-weight:600;

}

.register-link a:hover{

color:#D4AF37;

}

</style>

</head>

<body>

<div class="login-card">

<div class="logo">

🍽️

</div>

<h2>

Bella Vista

</h2>

<p class="tagline">

Fine Dining • Easy Reservations

</p>

<form method="POST">

<div class="mb-3">

<label>Email</label>

<input
type="email"
class="form-control"
name="email"
placeholder="Enter Email"
required>

</div>

<div class="mb-4">

<label>Password</label>

<input
type="password"
class="form-control"
name="password"
placeholder="Enter Password"
required>

</div>

<button
type="submit"
class="btn-login">

<i class="bi bi-box-arrow-in-right"></i>

Login

</button>

</form>

<div class="register-link">

Don't have an account?

<a href="{{ url_for('auth.register') }}">

Register

</a>

</div>

</div>

</body>

</html>
