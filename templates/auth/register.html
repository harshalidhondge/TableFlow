<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register | Bella Vista</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:
linear-gradient(rgba(0,0,0,.60),rgba(0,0,0,.60)),
url("{{ url_for('static', filename='images/restaurant-bg.jpg') }}");

background-size:cover;
background-position:center;

}

.register-card{

width:500px;

background:rgba(255,255,255,.93);

backdrop-filter:blur(18px);

padding:40px;

border-radius:25px;

box-shadow:0 20px 45px rgba(0,0,0,.35);

}

.logo{

font-size:45px;

text-align:center;

margin-bottom:10px;

}

h2{

text-align:center;

font-weight:700;

color:#1B4332;

}

.tag{

text-align:center;

margin-bottom:30px;

color:#777;

}

.form-control{

border-radius:12px;

padding:12px;

}

.form-control:focus{

border-color:#D4AF37;

box-shadow:0 0 10px rgba(212,175,55,.35);

}

.btn-register{

width:100%;

padding:12px;

background:#1B4332;

border:none;

border-radius:12px;

font-weight:600;

color:white;

transition:.3s;

}

.btn-register:hover{

background:#D4AF37;

color:#1B4332;

}

.login-link{

margin-top:20px;

text-align:center;

}

.login-link a{

text-decoration:none;

color:#1B4332;

font-weight:600;

}

.login-link a:hover{

color:#D4AF37;

}

</style>

</head>

<body>

<div class="register-card">

<div class="logo">

🍽️

</div>

<h2>Bella Vista</h2>

<p class="tag">

Create Your Restaurant Account

</p>

<form method="POST">

<div class="mb-3">

<label>Name</label>

<input
type="text"
class="form-control"
name="name"
required>

</div>

<div class="mb-3">

<label>Email</label>

<input
type="email"
class="form-control"
name="email"
required>

</div>

<div class="mb-3">

<label>Phone</label>

<input
type="text"
class="form-control"
name="phone"
required>

</div>

<div class="mb-4">

<label>Password</label>

<input
type="password"
class="form-control"
name="password"
required>

</div>

<button
type="submit"
class="btn-register">

<i class="bi bi-person-plus-fill"></i>

Create Account

</button>

</form>

<div class="login-link">

Already have an account?

<a href="{{ url_for('auth.login') }}">

Login

</a>

</div>

</div>

</body>

</html>
